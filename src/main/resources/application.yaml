# ============================================================
#  CONFIGURACIÓN DEL MICROSERVICIO
# ============================================================

server:
  port: 8080          # El backend correrá en http://localhost:8080

spring:
  application:
    name: tienda

  # ---------- Conexión a PostgreSQL ----------
  datasource:
    url: jdbc:postgresql://localhost:5432/tienda_db
    username: postgres
    password: pl04        # <-- AQUÍ va TU contraseña de PostgreSQL
    driver-class-name: org.postgresql.Driver

  # ---------- JPA / Hibernate ----------
  jpa:
    hibernate:
      ddl-auto: update        # Si falta una tabla o columna, Hibernate la crea
    show-sql: true            # Muestra en consola el SQL que se ejecuta
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ---------- Usuario para entrar a /actuator ----------
  security:
    user:
      name: admin
      password: admin123_cambiame
      roles: ACTUATOR_ADMIN

# ---------- Swagger ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html          # http://localhost:8000/swagger-ui.html
    operations-sorter: method

# ---------- Actuator (salud del servicio) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always